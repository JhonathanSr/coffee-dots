# ==============================================================================
# Coffee-Dots: Yazi Configuration (yazi.toml)
# Optimizado para rendimiento extremo, navegación Vim-like y renderizado GPU
# ==============================================================================

[manager]
ratio          = [ 1, 3, 4 ]       # Proporción de las columnas [Padre, Actual, Preview]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[opener]
edit = [
	{ run = '${EDITOR:-nvim} "$@"', block = true, for = "unix" }
]
open = [
	{ run = 'xdg-open "$@"', desc = "Abrir con el sistema", for = "unix" }
]
reveal = [
	{ run = 'xdg-open "$(dirname "$1")"', desc = "Revelar en el sistema", for = "unix" }
]
open_terminal = [
	{ run = 'ghostty --working-directory="$1"', desc = "Abrir en Ghostty", detach = true, for = "unix" }
]

[open]
rules = [
	# Forzar a que los directorios (folder) usen el opener de Ghostty
	{ mime = "inode/directory", use = [ "open_terminal" ] },

	{ mime = "text/*", use = [ "edit", "open" ] },
	{ mime = "application/json", use = [ "edit", "open" ] },
	{ mime = "image/*", use = [ "open", "reveal" ] },
	{ mime = "video/*", use = [ "open", "reveal" ] },
	{ mime = "audio/*", use = [ "open", "reveal" ] },
	{ mime = "application/pdf", use = [ "open", "reveal" ] },
	{ mime = "*", use = [ "open", "reveal" ] },
]

[preview]
max_width  = 1920
max_height = 1080
# Forzar el protocolo 'kitty' garantiza el passthrough nativo de imágenes por GPU en Ghostty/Alacritty
image_preview_delay = 15
image_bound         = [ 0, 0, 0, 0 ]

[plugin]
preloaders = [
	{ mime = "image/*", run = "image" },
	{ mime = "video/*", run = "video" },
	{ mime = "pdf/*",   run = "pdf" }
]
previewers = [
	{ mime = "text/*", run = "code" },
	{ mime = "*/javascript", run = "code" },
	{ mime = "*/json", run = "code" },
	{ mime = "image/*", run = "image" },
	{ mime = "video/*", run = "video" },
	{ mime = "application/pdf", run = "pdf" },
	{ mime = "application/x-tar", run = "archive" },
	{ mime = "application/zip", run = "archive" },
	{ mime = "application/x-bzip2", run = "archive" },
]

[input]
# Configuración para que los diálogos de input se sientan cómodos y minimalistas
cursor_blink = false

[confirm]
# Desactivar confirmaciones redundantes para flujos de trabajo rápidos
trash_title  = "Enviar al contenedor de basura? (y/N)"
delete_title = "Eliminar permanentemente? (y/N)"