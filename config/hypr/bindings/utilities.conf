# Menus
bindd = SUPER, D, Omarchy Menu, exec, $OMARCHY_BIN/omarchy-menu
bindd = SUPER, R, Menu, exec, rofi -show drun
bindd = SUPER, ESCAPE, Power menu, exec, $OMARCHY_BIN/omarchy-menu system
bindd = SUPER, K, Show key bindings, exec, $OMARCHY_BIN/omarchy-menu-keybindings

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, pkill -SIGUSR1 waybar
#bindd = SUPER CTRL, SPACE, Next background in theme, exec, omarchy-theme-bg-next
#bindd = SUPER SHIFT CTRL, SPACE, Pick new theme, exec, omarchy-menu theme

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb' && notify-send "Silenced notifications" || notify-send "Enabled notifications"

# Toggle idling
bindd = SUPER CTRL, I, Toggle locking on idle, exec, $OMARCHY_BIN/omarchy-toggle-idle

# Toggle nightlight
bindd = SUPER CTRL, N, Toggle nightlight, exec, $OMARCHY_BIN/omarchy-toggle-nightlight

# Screenshots
bindd = , PRINT, Screenshot of region, exec, $OMARCHY_BIN/omarchy-cmd-screenshot
bindd = SUPER SHIFT, S, Screenshot of region, exec, $OMARCHY_BIN/omarchy-cmd-screenshot
bindd = SHIFT, PRINT, Screenshot of window, exec, $OMARCHY_BIN/omarchy-cmd-screenshot window
bindd = CTRL, PRINT, Screenshot of display, exec, $OMARCHY_BIN/omarchy-cmd-screenshot output

# Screen recordings
bindd = ALT, PRINT, Screen record a region, exec, $OMARCHY_BIN/omarchy-cmd-screenrecord
bindd = CTRL ALT, PRINT, Screen record display, exec, $OMARCHY_BIN/omarchy-cmd-screenrecord output

# Color picker
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a
